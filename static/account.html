<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your account · Game Deal Tracker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before the page paints, so it never flashes.
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
      }
    } catch {
      // Storage blocked: follow the OS setting.
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="site.css">
</head>
<body data-page="account">
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="./" aria-label="Game Deal Tracker, home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" class="brand-bg"/>
          <path d="M6.5 9.5a1.5 1.5 0 0 1 1.5-1.5h10.4a1.5 1.5 0 0 1 1.06.44l6.5 6.5a1.5 1.5 0 0 1 0 2.12l-6.5 6.5a1.5 1.5 0 0 1-1.06.44H8a1.5 1.5 0 0 1-1.5-1.5z" class="brand-tag"/>
          <circle cx="20.5" cy="16" r="1.7" class="brand-bg"/>
          <path d="M12.5 11.5v8M9.5 16.5l3 3 3-3" class="brand-arrow"/>
        </svg>
        <span>Game Deal Tracker</span>
      </a>
      <div class="header-actions">
        <a class="nav-link" href="./">Deals</a>
        <button id="theme-switch" class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark theme">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-column">
      <div class="auth-head">
        <h1>Your account</h1>
      </div>

      <p id="account-loading" class="loading" role="status">Loading…</p>

      <div id="account-content" class="auth-column" hidden>
        <section class="card who" aria-label="Logged in user">
          <div>
            <p class="who-label">Logged in as</p>
            <p id="who-name" class="who-name"></p>
          </div>
          <button id="logout-button" class="button button-secondary" type="button">Log out</button>
        </section>

        <section class="card card-danger" aria-labelledby="delete-title">
          <h2 id="delete-title" class="card-title">Delete account</h2>
          <p class="card-text">This removes your account and your watchlist for good. Type your password to confirm.</p>
          <form id="delete-form" class="form" method="post" novalidate>
            <div class="field">
              <label for="delete-password">Password</label>
              <input id="delete-password" name="password" type="password"
                     autocomplete="current-password" maxlength="128" required>
            </div>
            <p id="form-error" class="form-error" role="alert"></p>
            <button class="button button-danger button-block" type="submit">Delete my account</button>
          </form>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      Prices in USD from <a href="https://www.cheapshark.com/" rel="noopener">CheapShark</a>.
    </div>
  </footer>

  <script src="site.js"></script>
  <script src="auth.js"></script>
</body>
</html>
